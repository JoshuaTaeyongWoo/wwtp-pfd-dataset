  nutrient_recovery_unit:      {ko: 영양염 회수, fallback: "sidestream_reactor/nutrient_recovery", evidence: [B2-01, B2-08, B2-17, B2-22], caption_count: 4}
  primary_filter:              {ko: 1차 여과, fallback: "primary_clarifier + primary_enhancement=primary_filter, or filtration_unit + label_text", evidence: [B2-08, B2-17, B2-22], caption_count: 0}
  adsorption_oxidation_unit:   {ko: 오존·AOP·활성탄 고도처리, fallback: "filtration_unit/activated_carbon; disinfection_unit(disinfectant=ozone|aop, purpose=micropollutant)", evidence: [B2-07, B2-13, B2-16, S-03], caption_count: 31}
  hydrocyclone:                {ko: 하이드로사이클론, fallback: "unknown_equipment + label_text", evidence: [B2-19], caption_count: 1}
