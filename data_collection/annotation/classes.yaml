  tag_kind_stream:    {tier: T2, values: [stream_no, flow, fraction, concentration, loading, performance, quality, hydraulic, other]}
  io_role:            {tier: T1, values: [raw_influent, settled_influent, external_waste_in, effluent, reclaimed_water_out, solids_disposal, biogas_use, off_gas_out, chemical_source, overflow_bypass_out, external_sidestream]}
