  zone_role:          {tier: T2, values: [main, selector, contact, reaeration, deoxygenation, degasifier, underflow_anoxic, post_anoxic, stripper, swing], note: swing is provisional (B2-03 unverified)}
  aeration_mode:      {tier: T2, values: [diffused, surface, brush, jet, hpo, membrane, mixer_only, none, unknown]}
