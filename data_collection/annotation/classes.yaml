  dechlorination:     {tier: T3, values: ["true", "false", unknown]}
  co_digestion:       {tier: T3, values: ["true", "false", unknown]}
  final_process:      {tier: T3, values: [drying, incineration, composting, pyrolysis_gasification]}
  standby_count:      {tier: T3, type: int}
  # --- connection-class attributes ---
