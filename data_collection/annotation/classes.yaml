# ---------------------------------------------------------------------------------------------
# Connection / annotation classes (8). Not graph nodes unless stated (plan §4.6).
# ---------------------------------------------------------------------------------------------
connection_classes:
  arrowhead:      {ko: 화살촉, node: false, definition: Arrowhead at the end of a flow line (tight box)., evidence: [T-03]}
  text_label:     {ko: 텍스트 라벨, node: false, definition: Unit name, zone name or design-value text block (also the name inside a unit box, rule 15)., attributes: [tag_kind_text], evidence: [B-24, K-08]}
  stream_tag:     {ko: 스트림 태그, node: false, definition: Numbers/IDs attached to a line - stream number, flow, concentration, fraction, loading, quality, hydraulic values., attributes: [tag_kind_stream], evidence: [B-24, K-08]}
  stream_label:   {ko: 스트림 이름, node: false, definition: Word label on/next to a line (RAS, WAS, a, s, r, reject water); mixed text+number is one stream_label with tag_kind., attributes: [stream_role], evidence: [B-20]}
  io_terminal:    {ko: 유입·유출 단자, node: true, definition: Plant-boundary arrow tail/head with its text (influent, effluent, external waste in, solids out, chemical source)., attributes: [io_role], evidence: [B-24, B2-15, D-07]}
  junction_split: {ko: 분기점, node: true, definition: Point where a line splits, or a drawn distribution box/divider (box covers the structure when drawn)., attributes: [split_type], evidence: [B-22, K-03]}
  junction_merge: {ko: 합류점, node: true, definition: Point where lines merge, incl. chemical dosing points and sidestream returns., attributes: [merge_role], evidence: [B-22, B-24]}
  instrument:     {ko: 계측·제어, node: optional, definition: Sensor/analyser/controller symbol or tag (DO, NH4, pH, F, L); src/dst of signal edges only., attributes: [measured_variable, instrument_role], evidence: [B-17, T-04, T-05, D-04]}

