  storage_tank:
    ko: 저류 탱크
    l1: ancillary
    position_free: true
    definition: Tank that only holds effluent, sludge, RAS or chemicals (no process function); treatment_line says which line.
    aliases: [storage tank, holding tank, sludge storage, sludge holding tank, chemical storage, 저류조, 슬러지저류조, 약품저장조, 처리수조, 여과기 이송조]
