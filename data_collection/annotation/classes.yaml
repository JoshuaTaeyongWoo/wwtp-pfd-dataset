# ---------------------------------------------------------------------------------------------
# Graph ground truth (plan §4.6): edges between leaf nodes
# ---------------------------------------------------------------------------------------------
edge_schema:
  fields: [id, src, dst, medium, stream_role, split_fraction, direction_confidence, line_style, evidence, polyline]
  medium:               [liquid, mixed_liquor, sludge, gas, air, chemical, solid, signal]
  stream_role:          [influent, settled_influent, effluent, reclaimed_water, mixed_liquor, internal_recycle_a, ras_s, r_recycle, effluent_recirculation_qr, was, scum, primary_sludge, thickened_sludge, digested_sludge, dewatered_cake, chemical_sludge, screenings_grit, fermentate, co_substrate, sidestream_return, backwash_return, bypass, overflow, step_feed, biogas, off_gas, air_supply, oxygen, chemical_dose, carbon_source, signal]
  direction_confidence: [arrowhead, inferred, ambiguous]
  line_style:           [solid, dashed, dotted, unknown]
  tier: {src: T1, dst: T1, medium: T1, direction_confidence: T1, stream_role: T2, split_fraction: T2, line_style: T2, evidence: T2, polyline: T3}
  rules:
    - splits and merges always go through a junction node
    - adjacent zones are connected by an inferred edge even without a drawn line
    - edge endpoints are leaf nodes (zone if zones exist, else the tank)
    - point-class boxes: junction side = max(12 px, 2 % of the shorter image side); drawn distribution boxes keep their outline
